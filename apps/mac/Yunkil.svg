<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    El yunque, que es la mitad del nombre. Silueta de patrón inglés: cuerno a la
    izquierda, cara plana de trabajo arriba, talón a la derecha, cintura y pie.

    Los dos colores dicen lo mismo que dentro de la aplicación: el turquesa del plato
    es lo medido —aquí, la pieza— y el naranja es el calor, la chispa que salta de la
    cara al golpe. El contorno lleva un trazo redondo del mismo color que el relleno
    para que las esquinas se suavicen sin tener que redondear cada vértice a mano.
  -->
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="920" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173F44"/>
      <stop offset=".55" stop-color="#10282E"/>
      <stop offset="1" stop-color="#091318"/>
    </linearGradient>
    <linearGradient id="hierro" x1="300" y1="330" x2="740" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8FFD4"/>
      <stop offset="1" stop-color="#2FA79B"/>
    </linearGradient>
    <linearGradient id="chispa" x1="700" y1="240" x2="760" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD79A"/>
      <stop offset="1" stop-color="#E8833A"/>
    </linearGradient>
  </defs>

  <rect x="44" y="44" width="936" height="936" rx="228" fill="url(#bg)"/>

  <g transform="translate(512 526) scale(1.08) translate(-512 -526)">
    <g fill="url(#hierro)" stroke="url(#hierro)" stroke-width="18" stroke-linejoin="round">
      <path d="M150 430
               C216 416 262 398 302 372
               L762 372
               L762 452
               L706 452
               C670 452 652 478 648 516
               L638 570
               C633 592 646 606 668 610
               L712 620
               C738 625 756 646 756 672
               L756 716
               L308 716
               L308 672
               C308 646 326 625 352 620
               L396 610
               C418 606 431 592 426 570
               L416 516
               C412 478 394 452 358 452
               L302 452
               C258 448 208 442 150 448
               Z"/>
    </g>

    <!-- La junta de la cara de trabajo: en un yunque de verdad va soldada sobre el cuerpo. -->
    <path d="M330 424H740" stroke="#0B1A1D" stroke-width="12" stroke-linecap="round" opacity=".32"/>
  </g>

  <!-- La chispa. Naranja, y solo aquí: en la aplicación ese color significa calor. -->
  <circle cx="742" cy="292" r="38" fill="url(#chispa)"/>
  <circle cx="655" cy="238" r="16" fill="#FFC98A" opacity=".85"/>
</svg>
